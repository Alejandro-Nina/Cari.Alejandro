# ==============================

# Factores FA y FV (Tablas 3.3 y 3.4)
FA_TABLE = {
    "S0": [(0.067,0.8),(0.133,0.8),(0.2,0.8),(0.267,0.8),(float("inf"),0.8)],
    "S1": [(0.067,0.9),(0.133,0.9),(0.2,0.9),(0.267,0.9),(float("inf"),0.9)],

    "S3": [(0.067,1.6),(0.133,1.4),(0.2,1.2),(0.267,1.1),(float("inf"),1.1)],
    "S4": [(0.067,2.4),(0.133,1.7),(0.2,1.3),(0.267,1.2),(float("inf"),1.2)],
}
FV_TABLE = {
    "S0": [(0.044,0.8),(0.089,0.8),(0.133,0.8),(0.178,0.8),(float("inf"),0.8)],
    "S1": [(0.044,0.8),(0.089,0.8),(0.133,0.8),(0.178,0.8),(float("inf"),0.8)],

}

# Factor de Importancia (Tabla 2.2)
IE_DICT = {"I":1.0,"II":1.0,"III":1.3,"IV":1.5}

# Reducción sísmica R (Capítulo 4 NB-DSR-23)
R_TABLE = {
    "Marcos dúctiles de hormigón armado":8,
    "Muros estructurales de hormigón":5,
    "Sistemas duales (marco+muros)":6,
    "Estructuras de acero dúctiles":8,
    "Sistemas prefabricados con conexión dúctil":5,
    "Estructuras de albañilería reforzada":4,
    "Estructuras de albañilería confinada":3,
    "Otros sistemas especiales":3,
}

# ==============================
# FUNCIONES DE CÁLCULO NB-DSR-23
# ==============================
def lookup_coeff(tabla,suelo,S0):
    for umbral,valor in tabla[suelo]:
        if S0 <= umbral:
            return valor
    return tabla[suelo][-1][1]

def periodos(Fa,Fv):
    T0 = 0.15*(Fv/Fa)
    Ts = 0.5*(Fv/Fa)
    Tl = 4.0*(Fv/Fa)
    return T0,Ts,Tl

def Sa_elastico(T,Fa,Fv,S0,T0,Ts,Tl):
    if T < T0:
        return Fa*S0*(1 + 1.5*(T/T0))
    elif T0 <= T <= Ts:
        return 2.5*Fa*S0
    elif Ts < T <= Tl:
        return (1.25*Fv*S0)/T
    else:
        return (1.25*Fv*S0*Tl)/(T**2)

def Sa_diseno(Sae,Ie,Tau,FIT,R,G,eta):
    return Sae*Ie*Tau*FIT/R*G*eta

def Sd_pseudo(T,Sa):
    """Desplazamiento pseudo-espectral [m]"""
    if T == 0: return 0
    return (T**2/(4*pi**2))*Sa

# ==============================
# MANEJO DE CONFIGURACIÓN (JSON)
# ==============================
CONFIG_FILE = "config.json"

def guardar_config(data):
    try:
        with open(CONFIG_FILE,"w") as f:
            json.dump(data,f,indent=4)
    except Exception as e:
        print("Error guardando configuración:", e)

def cargar_config():
    if not os.path.exists(CONFIG_FILE):
        return {}
    try:
        with open(CONFIG_FILE,"r") as f:
            return json.load(f)
    except:
        return {}

# ==============================
# CÁLCULO PRINCIPAL DEL ESPECTRO
# ==============================
def calcular_espectros(params):
    S0 = params["S0"]
    Ie = params["Ie"]
    R = params["R"]
    Ip = params["Ip"]
    Ia = params["Ia"]
    Tau = params["Tau"]
    suelo = params["suelo"]
    Cd = params["Cd"]
    xi = params["xi"]  # amortiguamiento
    eta = sqrt(10/(5+xi))  # factor correctivo por amortiguamiento
    FIT = max(1 - Ip - Ia, 0.5)

    Fa = lookup_coeff(FA_TABLE, suelo, S0)
    Fv = lookup_coeff(FV_TABLE, suelo, S0)
    T0, Ts, Tl = periodos(Fa, Fv)

    Tn = np.arange(0, 10.05, 0.05)
    Sa_e, Sa_d, Sd_d = [], [], []

    for T in Tn:
        Sae = Sa_elastico(T, Fa, Fv, S0, T0, Ts, Tl)
        Sad = Sa_diseno(Sae, Ie, Tau, FIT, R, G, eta)
        Sdd = Sd_pseudo(T, Sad)
        Sa_e.append(Sae)
        Sa_d.append(Sad)
        Sd_d.append(Sdd)

    resultados = {
        "T": Tn,
        "Sa_el": Sa_e,
        "Sa_dis": Sa_d,
        "Sd_dis": Sd_d,
        "Fa": Fa, "Fv": Fv, "FIT": FIT, "eta": eta,
        "T0": T0, "Ts": Ts, "Tl": Tl
    }
    return resultados

# ==============================
# EXPORTACIONES DE ARCHIVOS
# ==============================
def exportar_csv(resultados):
    f = filedialog.asksaveasfilename(defaultextension=".csv")
    if not f: return
    with open(f,"w",newline="") as file:
        w = csv.writer(file)
        w.writerow(["T(s)","Sa_el(g)","Sa_dis(m/s²)","Sd_dis(m)"])
        for i in range(len(resultados["T"])):
            w.writerow([
                f"{resultados['T'][i]:.2f}",
                f"{resultados['Sa_el'][i]:.5f}",
                f"{resultados['Sa_dis'][i]:.5f}",
                f"{resultados['Sd_dis'][i]:.5f}"
            ])
    messagebox.showinfo("Éxito","Archivo CSV exportado correctamente.")

def exportar_png(figura):
    f = filedialog.asksaveasfilename(defaultextension=".png")
    if not f: return
    figura.savefig(f,bbox_inches="tight",dpi=200,facecolor="#000000")
    messagebox.showinfo("Éxito","Gráfica guardada correctamente.")

# ==============================

    root = tk.Tk()
    root.title("💠 Espectro de Respuesta Sísmica – NB-DSR-23 Profesional")
    root.configure(bg=COLOR_BG)
    root.geometry("1150x700")
    root.minsize(1000,650)

    # --- ENCABEZADO ---
    frame_top = tk.Frame(root,bg=COLOR_BG)
    frame_top.pack(fill=tk.X,pady=6)
    try:
        logo = Image.open("img/ucb_logo.png")
        logo = logo.resize((60,80))
        logo = ImageTk.PhotoImage(logo)
        tk.Label(frame_top,image=logo,bg=COLOR_BG).pack(side=tk.LEFT,padx=10)
    except:
        pass
    tk.Label(frame_top,text="UNIVERSIDAD CATÓLICA BOLIVIANA SAN PABLO\nPROYECTO DE GRADO 2025 – NB-DSR-23",
             bg=COLOR_BG,fg=COLOR_ACCENT,font=FONT_TITLE,justify="center").pack(side=tk.LEFT,anchor="w")

    # --- CUERPO PRINCIPAL ---
    frame_main = tk.Frame(root,bg=COLOR_BG)
    frame_main.pack(fill=tk.BOTH,expand=True)

    # PANEL IZQUIERDO (Entradas)
    panel = tk.Frame(frame_main,bg=COLOR_PANEL,bd=2,relief="ridge")
    panel.pack(side=tk.LEFT,fill=tk.Y,padx=10,pady=10)

    # Cargar configuración previa
    cfg = cargar_config()

    campos = [
        ("S₀ (Pseudoacel. g)", cfg.get("S0",0.24)),
        ("Factor de Importancia", cfg.get("Ie","II")),
        ("Sistema estructural", cfg.get("sistema","Marcos dúctiles de hormigón armado")),
        ("Irregularidad en Planta (Ip)", cfg.get("Ip",0)),
        ("Irregularidad en Altura (Ia)", cfg.get("Ia",0)),
        ("Amplificación Topográfica (τ)", cfg.get("Tau",1.0)),
        ("Tipo de Suelo", cfg.get("suelo","S2")),
        ("Cd (Ductilidad)", cfg.get("Cd",5.5)),
        ("ξ (Amortiguamiento %)", cfg.get("xi",5.0)),
    ]

    entradas = {}

    for i,(txt,val) in enumerate(campos):
        tk.Label(panel,text=txt,bg=COLOR_PANEL,fg=COLOR_TEXT,font=FONT_LABEL).grid(row=i,column=0,sticky="w",pady=3,padx=4)
        if "Importancia" in txt:
            combo = ttk.Combobox(panel,values=list(IE_DICT.keys()),state="readonly",width=8)
            combo.grid(row=i,column=1,pady=2); combo.set(val)
            entradas["Ie"]=combo
        elif "Sistema" in txt:
            combo = ttk.Combobox(panel,values=list(R_TABLE.keys()),state="readonly",width=30)
            combo.grid(row=i,column=1,pady=2); combo.set(val)
            entradas["sistema"]=combo
        elif "Suelo" in txt:
            combo = ttk.Combobox(panel,values=list(FA_TABLE.keys()),state="readonly",width=8)
            combo.grid(row=i,column=1,pady=2); combo.set(val)
            entradas["suelo"]=combo
        else:
            e = tk.Entry(panel,width=10,bg=COLOR_ENTRY,fg="white",insertbackground="white",font=FONT_ENTRY)
            e.grid(row=i,column=1,pady=2)
            e.insert(0,str(val))
            entradas[txt]=e

    # --- Pestañas de gráficos ---
    notebook = ttk.Notebook(frame_main)
    notebook.pack(side=tk.RIGHT,fill=tk.BOTH,expand=True,padx=10,pady=10)

    # --- Pestaña 1: Espectro de Aceleración ---
    tab_sa = tk.Frame(notebook,bg=COLOR_BG)
    notebook.add(tab_sa,text="Espectro de Aceleración (Sa)")
    fig_sa = plt.Figure(figsize=(6,5),dpi=100,facecolor="#000000")
    ax_sa = fig_sa.add_subplot(111)
    canvas_sa = FigureCanvasTkAgg(fig_sa,master=tab_sa)
    canvas_sa.get_tk_widget().pack(fill=tk.BOTH,expand=True)

    # --- Pestaña 2: Espectro de Desplazamiento ---
    tab_sd = tk.Frame(notebook,bg=COLOR_BG)
    notebook.add(tab_sd,text="Espectro de Desplazamiento (Sd)")
    fig_sd = plt.Figure(figsize=(6,5),dpi=100,facecolor="#000000")
    ax_sd = fig_sd.add_subplot(111)
    canvas_sd = FigureCanvasTkAgg(fig_sd,master=tab_sd)
    canvas_sd.get_tk_widget().pack(fill=tk.BOTH,expand=True)

    # --- Pestaña 3: Comparación ---
    tab_cmp = tk.Frame(notebook,bg=COLOR_BG)
    notebook.add(tab_cmp,text="Comparación de Espectros")
    fig_cmp = plt.Figure(figsize=(6,5),dpi=100,facecolor="#000000")
    ax_cmp = fig_cmp.add_subplot(111)
    canvas_cmp = FigureCanvasTkAgg(fig_cmp,master=tab_cmp)
    canvas_cmp.get_tk_widget().pack(fill=tk.BOTH,expand=True)

    # ==============================
    # FUNCIONES INTERNAS
    # ==============================
    def ejecutar_calculo():
        try:
            params = {
                "S0": float(entradas["S₀ (Pseudoacel. g)"].get()),
                "Ie": IE_DICT[entradas["Ie"].get()],
                "sistema": entradas["sistema"].get(),
                "R": R_TABLE[entradas["sistema"].get()],
                "Ip": float(entradas["Irregularidad en Planta (Ip)"].get()),
                "Ia": float(entradas["Irregularidad en Altura (Ia)"].get()),
                "Tau": float(entradas["Amplificación Topográfica (τ)"].get()),
                "suelo": entradas["suelo"].get(),
                "Cd": float(entradas["Cd (Ductilidad)"].get()),
                "xi": float(entradas["ξ (Amortiguamiento %)"].get()),
            }
        except:
            messagebox.showerror("Error","Por favor ingrese los valores correctamente."); return

        # Guardar configuración
        guardar_config(params)
        res = calcular_espectros(params)

        # --- Gráfica Sa ---
        ax_sa.clear()
        ax_sa.set_facecolor("#000000")
        ax_sa.plot(res["T"],res["Sa_el"],"--",color=COLOR_ACCENT,linewidth=2.0,label="Sa Elástico (g)")
        ax_sa.plot(res["T"],res["Sa_dis"],color=COLOR_PRIMARY,linewidth=2.5,label="Sa Diseño (m/s²)")
        ax_sa.set_xlabel("Período (s)",color="white"); ax_sa.set_ylabel("Aceleración (m/s²)",color="white")
        ax_sa.grid(True,linestyle="--",alpha=0.4); ax_sa.tick_params(colors="white")
        ax_sa.legend(facecolor="#222",edgecolor="#555",labelcolor="white",fontsize=8)
        mplcursors.cursor(ax_sa,hover=True)
        canvas_sa.draw()

        # --- Gráfica Sd ---
        ax_sd.clear()
        ax_sd.set_facecolor("#000000")
        ax_sd.plot(res["T"],res["Sd_dis"],color=COLOR_ACCENT,linewidth=2.5,label="Sd (m)")
        ax_sd.set_xlabel("Período (s)",color="white"); ax_sd.set_ylabel("Desplazamiento (m)",color="white")
        ax_sd.grid(True,linestyle="--",alpha=0.4); ax_sd.tick_params(colors="white")
        ax_sd.legend(facecolor="#222",edgecolor="#555",labelcolor="white",fontsize=8)
        mplcursors.cursor(ax_sd,hover=True)
        canvas_sd.draw()

        # Guardar para exportar
        global resultados_global, params_global, fig_sa_global, fig_sd_global
        resultados_global = res
        params_global = params
        fig_sa_global = fig_sa
        fig_sd_global = fig_sd
        messagebox.showinfo("Cálculo completado","El espectro ha sido calculado correctamente según NB-DSR-23.")

    # --- Cargar espectro externo (comparación) ---
    def cargar_espectro_externo():
        file = filedialog.askopenfilename(filetypes=[("CSV","*.csv")])
        if not file: return
        T, Sa = [], []
        with open(file,"r") as f:
            reader = csv.reader(f)
            next(reader)
            for row in reader:
                try:
                    T.append(float(row[0])); Sa.append(float(row[1]))
                except: pass
        ax_cmp.clear()
        ax_cmp.set_facecolor("#000000")
        ax_cmp.plot(resultados_global["T"],resultados_global["Sa_dis"],color=COLOR_PRIMARY,linewidth=2.5,label="NB-DSR-23 Diseño")
        ax_cmp.plot(T,Sa,"--",color=COLOR_ACCENT,linewidth=2,label="Espectro Externo (CSV)")
        ax_cmp.set_xlabel("Período (s)",color="white"); ax_cmp.set_ylabel("Aceleración (m/s²)",color="white")
        ax_cmp.grid(True,linestyle="--",alpha=0.4); ax_cmp.tick_params(colors="white")
        ax_cmp.legend(facecolor="#222",edgecolor="#555",labelcolor="white",fontsize=8)
        mplcursors.cursor(ax_cmp,hover=True)
        canvas_cmp.draw()

    # --- BOTONES ---
    tk.Button(panel,text="Calcular y Graficar",bg=COLOR_ACCENT,fg="white",font=FONT_LABEL,
              relief="flat",command=ejecutar_calculo).grid(row=10,column=0,columnspan=2,pady=5,ipadx=5)
    tk.Button(panel,text="Exportar CSV",bg=COLOR_PRIMARY,fg="black",font=FONT_LABEL,relief="flat",
              command=lambda: exportar_csv(resultados_global)).grid(row=11,column=0,columnspan=2,pady=3)
    tk.Button(panel,text="Guardar PNG",bg=COLOR_PRIMARY,fg="black",font=FONT_LABEL,relief="flat",
              command=lambda: exportar_png(fig_sa_global)).grid(row=12,column=0,columnspan=2,pady=3)
    tk.Button(panel,text="Exportar PDF",bg=COLOR_PRIMARY,fg="black",font=FONT_LABEL,relief="flat",
              command=lambda: exportar_pdf(resultados_global,fig_sa_global,fig_sd_global,params_global)).grid(row=13,column=0,columnspan=2,pady=3)
    tk.Button(panel,text="Comparar con CSV externo",bg="#4444FF",fg="white",font=FONT_LABEL,relief="flat",
              command=cargar_espectro_externo).grid(row=14,column=0,columnspan=2,pady=5)

    root.mainloop()

        print("Error en la ejecución:", e)
        messagebox.showerror("Error crítico", f"Ocurrió un error inesperado:\n{e}")

  <script>
    // Inserta el código en el bloque <code> y activa highlight
    const src = document.getElementById('pySource').textContent.trimStart();
    const codeEl = document.getElementById('codeBlock');
    codeEl.textContent = src;
    hljs.highlightElement(codeEl);

    // Copiar al portapapeles
    document.getElementById('copyBtn').addEventListener('click', async () => {
      try {
        await navigator.clipboard.writeText(src);
        const b = document.getElementById('copyBtn');
        const old = b.textContent;
        b.textContent = '¡Copiado!';
        setTimeout(()=> b.textContent = old, 1200);
      } catch(e){ alert('No se pudo copiar: ' + e); }
    });

    // Descargar como .py
    document.getElementById('downloadBtn').addEventListener('click', () => {
      const blob = new Blob([src], { type: 'text/x-python;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'EspectroNBDS23_Professional.py';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
  </script>
